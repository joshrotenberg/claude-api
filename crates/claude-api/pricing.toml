# Bundled per-model pricing rates baked into PricingTable::default().
#
# Updates: edit the relevant [[models]] entry. The `build.rs` script reads
# this file and emits Rust source at compile time; no runtime parsing.
#
# Rates are USD per million tokens unless noted, first-party Claude API
# list prices. Cache rates default to the standard Anthropic multipliers
# (5m = 1.25x input, 1h = 2x input, read = 0.1x input) when omitted --
# override by setting the explicit `cache_creation_5m_per_mtok` /
# `cache_creation_1h_per_mtok` / `cache_read_per_mtok` fields.
# `web_search_per_request` is per-call USD.
#
# A model whose rate depends on prompt size carries a `[models.long_context]`
# table: when the prompt (input + cache write + cache read tokens) exceeds
# `above_prompt_tokens`, the whole request is billed at that tier's rates.
# Its cache rates follow the same defaults, derived from the tier's input
# rate.
#
# Not modeled: fast mode, Batch API and Priority Tier pricing, and
# partner-platform (Bedrock, Vertex) rates.
#
# Last checked: 2026-10-19.

